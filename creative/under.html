    <style>
        .message {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #111827;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            justify-content: center;
        }

            .message dots {
                justify-content: center;
            }

            /* Simple dot animation */
            .dots::after {
                content: '';
                display: inline-block;
                width: 0.5em;
                text-align: left;
                animation: dots 1.5s steps(3, end) infinite;
            }

        @keyframes dots {
            0%, 20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%, 100% {
                content: '...';
            }
        }
    main {
        margin-top:-100px;
    }
    
    </style>

  <style>
    /* == CUSTOM CURSOR (same as root index.html) == */
    body { cursor: none; }
    #cursor { display: none; } /* legacy cursor div, superseded by ring+dot */
    #cursor-ring {
      position: fixed; top: 0; left: 0; z-index: 10001;
      width: 36px; height: 36px;
      border: 1.5px solid #0c0c0c;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width .18s ease, height .18s ease, opacity .18s ease, border-color .18s ease;
      mix-blend-mode: multiply;
    }
    #cursor-dot {
      position: fixed; top: 0; left: 0; z-index: 10001;
      width: 5px; height: 5px;
      background: #0c0c0c;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    body:not(.mouse-moved) #cursor-ring,
    body:not(.mouse-moved) #cursor-dot { opacity: 0; }
    @media (max-width: 900px) {
      body { cursor: auto; }
      #cursor-ring, #cursor-dot { display: none; }
    }
  </style>
</head>

<body>
